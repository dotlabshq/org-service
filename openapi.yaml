openapi: 3.1.0
info:
  title: org-service
  version: "1.0"
  description: |
    Organisations, membership, the scope tree, and the policy decision point.

    **Mounting.** Routes live at the service root. Behind a gateway the service
    is published at `/v1/org/...` with that prefix stripped, so `/orgs` here is
    `https://<host>/v1/org/orgs` in public. The old `/v1/orgs` paths are still
    served for callers that predate the gateway; they will be removed.

    **Identity comes from the realm's token, roles come from here.** A token
    carries `sub` and `type` and no organisation or role — membership changes
    while a token lives, so a token carrying a role would go stale and lie. Ask
    this service and cache the answer for under a minute.

    **Absence is not disclosed.** An organisation the caller is not a member of
    answers `404`, never `403`. A `403` would confirm it exists and turn a slug
    guess into a membership oracle.

servers:
  - url: https://example.com/v1/org
    description: Behind a gateway
  - url: http://127.0.0.1:3006
    description: Direct, for local development

tags:
  - name: discovery
    description: Unauthenticated
  - name: orgs
  - name: members
  - name: scopes
    description: Workspaces, projects and environments under an organisation
  - name: pdp
    description: Policy decisions — who may do what, where

paths:
  /healthz:
    get:
      tags: [discovery]
      summary: Liveness
      security: []
      responses:
        "200": { description: ok }

  /.well-known/service:
    get:
      tags: [discovery]
      summary: What this service is and what contract it speaks
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceManifest" }

  /orgs:
    get:
      tags: [orgs]
      summary: Organisations the caller belongs to
      description: Each row carries the caller's own role in that organisation.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
    post:
      tags: [orgs]
      summary: Create an organisation
      description: |
        The caller becomes its `owner`. The slug is derived from the name when
        omitted, and is **permanent** once set — see `PATCH /orgs/{ref}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
        "409": { description: slug_taken }

  /all-orgs:
    get:
      tags: [orgs]
      summary: Every organisation
      description: |
        **Service tokens only.** Not a user surface: it exists for a service that
        has already established its own operator authorisation and needs the
        list. A user token gets `403` regardless of role.

        Keep this off the public gateway. A wildcard route that exposes it puts
        a service token between the internet and the whole customer list.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
        "403": { description: Not a service token }

  /orgs/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
        description: Slug or id
    get:
      tags: [orgs]
      summary: One organisation
      description: |
        Members of any role may read it; so may a service token, on the same
        basis as `/all-orgs`. A non-member gets `404`, not `403`.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
        "404": { description: Does not exist, or the caller is not a member }
    patch:
      tags: [orgs]
      summary: Rename an organisation
      description: |
        Owner or admin. The display name is free to change.

        **The slug is not.** Hostnames, URLs and bookmarks are derived from it
        downstream — zone9 builds `<slug>.zone9.run` — and renaming breaks all of
        them silently, in another system. A patch that moves the slug is refused
        whole rather than half-applied, with `409 slug_immutable`. A realm where
        nothing derives names from slugs can set `ORG_ALLOW_SLUG_CHANGE=true`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
        "403": { description: Not an owner or admin }
        "409": { description: slug_immutable, or slug_taken }
    delete:
      tags: [orgs]
      summary: Archive an organisation
      description: Owner only.
      responses:
        "200": { description: ok }
        "403": { description: Not an owner }

  /orgs/{ref}/metadata:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    patch:
      tags: [orgs]
      summary: Merge metadata
      description: Owner or admin. Keys are merged; absent keys are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: ok }

  /orgs/{ref}/metadata/{key}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: key, in: path, required: true, schema: { type: string } }
    delete:
      tags: [orgs]
      summary: Remove one metadata key
      responses:
        "200": { description: ok }

  /orgs/{ref}/members:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      tags: [members]
      summary: Members of an organisation
      description: Any member may read the list.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
    post:
      tags: [members]
      summary: Add a member
      description: |
        Owner or admin. A **service** may also do this when it is named in
        `ORG_MEMBERSHIP_WRITERS`, acting as itself — the audit trail then records
        the service, which is the truth.

        That allowance exists because the alternative in practice was worse: a
        product API that needed to add a member was minting a token as the
        inviting *user*, because acting as itself was not permitted.

        Deny by default: an empty list means no service may.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/Membership" }
        "403": { description: Not permitted }
        "404": { description: No such organisation }

  /orgs/{ref}/members/{userId}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [members]
      summary: Remove a member
      description: Same rule as adding one.
      responses:
        "200": { description: ok }
        "403": { description: Not permitted }

  /orgs/{orgRef}/workspaces:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: Workspaces
      responses:
        "200": { description: ok }
    post:
      tags: [scopes]
      summary: Create a workspace
      responses:
        "201": { description: Created }

  /orgs/{orgRef}/workspaces/{wsRef}:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
      - { name: wsRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: One workspace
      responses:
        "200": { description: ok }
    patch:
      tags: [scopes]
      summary: Rename a workspace
      responses:
        "200": { description: ok }
    delete:
      tags: [scopes]
      summary: Archive a workspace
      responses:
        "200": { description: ok }

  /orgs/{orgRef}/workspaces/{wsRef}/projects:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
      - { name: wsRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: Projects
      responses:
        "200": { description: ok }
    post:
      tags: [scopes]
      summary: Create a project
      responses:
        "201": { description: Created }

  /orgs/{orgRef}/workspaces/{wsRef}/projects/{projRef}:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
      - { name: wsRef, in: path, required: true, schema: { type: string } }
      - { name: projRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: One project
      responses:
        "200": { description: ok }
    patch:
      tags: [scopes]
      summary: Rename a project
      responses:
        "200": { description: ok }
    delete:
      tags: [scopes]
      summary: Archive a project
      responses:
        "200": { description: ok }

  /orgs/{orgRef}/workspaces/{wsRef}/projects/{projRef}/envs:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
      - { name: wsRef, in: path, required: true, schema: { type: string } }
      - { name: projRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: Environments
      responses:
        "200": { description: ok }
    post:
      tags: [scopes]
      summary: Create an environment
      responses:
        "201": { description: Created }

  /orgs/{orgRef}/workspaces/{wsRef}/projects/{projRef}/envs/{envRef}:
    parameters:
      - { name: orgRef, in: path, required: true, schema: { type: string } }
      - { name: wsRef, in: path, required: true, schema: { type: string } }
      - { name: projRef, in: path, required: true, schema: { type: string } }
      - { name: envRef, in: path, required: true, schema: { type: string } }
    get:
      tags: [scopes]
      summary: One environment
      responses:
        "200": { description: ok }
    patch:
      tags: [scopes]
      summary: Rename an environment
      responses:
        "200": { description: ok }
    delete:
      tags: [scopes]
      summary: Archive an environment
      responses:
        "200": { description: ok }

  /authz/role:
    get:
      tags: [pdp]
      summary: Effective role at a scope
      description: |
        The org role, inherited downward through the scope tree. Defaults to the
        caller; pass `user` to ask about somebody else.
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200": { description: ok }
        "400": { description: scope required }

  /authz/check:
    post:
      tags: [pdp]
      summary: May this user take this action here?
      description: |
        Deny by default. The decision compares the caller's effective role at the
        scope against the minimum role the app registered for that action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app, action, scope_id]
              properties:
                app: { type: string }
                action: { type: string }
                scope_id: { type: string }
                user_id: { type: string, description: Defaults to the caller }
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow: { type: boolean }

  /apps:
    get:
      tags: [pdp]
      summary: Registered apps
      responses:
        "200": { description: ok }

  /apps/register:
    post:
      tags: [pdp]
      summary: Register an app and its action policy
      description: |
        An app declares the minimum role each of its actions needs. This is the
        policy the decision point compares against; an unregistered action is
        denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, actions]
              properties:
                name: { type: string }
                origin: { type: string }
                actions:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Registered }

  /apps/{name}/policies:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [pdp]
      summary: An app's action policy
      responses:
        "200": { description: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [owner, admin, member, viewer]
      description: Ranked; `owner` outranks `admin`, and so on down.

    Org:
      type: object
      required: [id, shortId, slug, name]
      properties:
        id: { type: string }
        shortId: { type: string, description: Short, human-quotable }
        slug: { type: string, description: Permanent once set }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: integer }
        metadata: { type: object, additionalProperties: true }

    Membership:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: integer }

    ServiceManifest:
      type: object
      required: [name, version, api_version]
      properties:
        name: { type: string, example: org }
        version: { type: string }
        api_version: { type: string }
        openapi_url: { type: string }
        capabilities:
          type: array
          items: { type: string }

security:
  - bearerAuth: []
