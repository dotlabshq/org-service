[app]
name  = "org-service"
image = "ghcr.io/dotlabshq/org-service:0.4.0"

# org-service backs onto its own private foldbase sibling (ADR 0001) — no direct
# DB. The sibling URL + service token are injected by the platform; the tenant
# is pinned to 'platform' because org ids are read-model keys, not tenants.
[env]
FOLDBASE_TENANT = "platform"
# FOLDBASE_SERVICE_URL, FOLDBASE_TOKEN — injected at deploy.
